services:
  api_gateway:
    build:
      context: .
      dockerfile: ./http-api-gateway/Dockerfile.prod
    image: api_gateway-prod
    ports:
      - "3000:3000"
    env_file:
      - ./http-api-gateway/.env
      - ./.env
    depends_on:
      - nats

  camera_microservice:
    build: ./camera-microservice
    volumes:
      - ./camera-microservice/src:/usr/src/app/src
    command: npm run start:dev
    env_file:
      - ./.env
    depends_on:
      - nats

  users_microservice:
    build:
      context: .
      dockerfile: ./users-microservice/Dockerfile.prod
    image: users_microservice-prod
    env_file:
      - ./.env
      - ./users-microservice/.env
    depends_on:
      - nats

  modules_microservice:
    build:
      context: .
      dockerfile: ./modules-microservice/Dockerfile.prod
    image: modules_microservice-prod
    env_file:
      - ./.env
    depends_on:
      - nats

  institute_microservice:
    build:
      context: .
      dockerfile: ./institute-microservice/Dockerfile.prod
    image: institute_microservice-prod
    env_file:
      - ./.env
    depends_on:
      - nats

  incident_microservice:
    build:
      context: .
      dockerfile: ./incident-microservice/Dockerfile.prod
    image: incident_microservice-prod
    volumes:
      - ./incident-microservice/fonts:/usr/src/app/fonts
    env_file:
      - ./.env
      - ./incident-microservice/.env
    depends_on:
      - nats

  people-management-microservice:
    build:
      context: .
      dockerfile: ./people-management-microservice/Dockerfile.prod
    image: people-management_microservice-prod
    env_file:
      - ./.env
      - ./people-management-microservice/.env
    depends_on:
      - nats

  dashboard_microservice:
    build:
      context: .
      dockerfile: ./dashboard-microservice/Dockerfile.prod
    image: dashboard_microservice-prod
    env_file:
      - ./.env
    depends_on:
      - nats

  nats:
    image: nats
    ports:
      - 4222:4222
